<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miruo İletişim — Destek alın ve bize ulaşın</title>
<meta name="description" content="Miruo ekibi ile iletişime geçin. Destek, öneri ve iş birlikleri.">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="website.css">
<style>
  body {
    overflow-y: auto !important;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: #0E0512;
  }
  .page-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
</style>
</head>
<body>
<!-- Starfield Canvas -->
<canvas id="starCanvas"></canvas>

<!-- Top Navigation -->
<nav>
  <div class="wrap">
    <a class="brand" href="/">
      <div class="brand-icon">
        <img src="logo.png" alt="Miruo Baykuşu" class="nav-spinning-owl">
      </div>
      MIRUO
    </a>
    <div class="nav-links">
      <a href="/guvenlik">Güvenlik</a>
      <a href="/sss">SSS</a>
      <a href="/basin">Basın</a>
    </div>
  </div>
</nav>

<!-- Main Contact Content -->
<main class="page-main">
  <div class="rave-contact-container">
    <h1 class="rave-contact-title">Bize Ulaşın</h1>

    <form id="contactForm" onsubmit="event.preventDefault(); window.handleContactSubmit();">
      <div class="rave-form-group">
        <label class="rave-form-label" for="contactName">Adınızı girin <span style="color:#FF6EB4;">*</span></label>
        <input type="text" id="contactName" class="rave-form-input" placeholder="Ahmet Yılmaz" required>
      </div>

      <div class="rave-form-group">
        <label class="rave-form-label" for="contactEmail">E-postanızı girin <span style="color:#FF6EB4;">*</span></label>
        <input type="email" id="contactEmail" class="rave-form-input" placeholder="ahmet@ornek.com" required>
      </div>

      <div class="rave-form-group">
        <label class="rave-form-label" for="contactUser">Kullanıcı adı</label>
        <input type="text" id="contactUser" class="rave-form-input" placeholder="@ahmetdoe123">
      </div>

      <div class="rave-form-group">
        <label class="rave-form-label" for="contactSubject">Konuyu girin <span style="color:#FF6EB4;">*</span></label>
        <input type="text" id="contactSubject" class="rave-form-input" placeholder="Nasıl yardımcı olabiliriz?" required>
      </div>

      <div class="rave-form-group">
        <label class="rave-form-label" for="contactMessage">Mesajınızı girin <span style="color:#FF6EB4;">*</span></label>
        <textarea id="contactMessage" class="rave-form-textarea" rows="5" placeholder="Lütfen sorunuzu veya endişenizi ayrıntılı olarak açıklayın..." required></textarea>
      </div>

      <button type="submit" class="rave-form-btn">Mesajı gönder</button>
    </form>
  </div>
</main>

<!-- Footer -->
<footer class="footer-rave" style="margin-top:auto;">
  <div class="wrap">
    <div class="social-icons-row">
      <a href="https://facebook.com" target="_blank" rel="noopener" class="social-circle-btn" aria-label="Facebook">
        <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
      </a>
      <a href="https://instagram.com" target="_blank" rel="noopener" class="social-circle-btn" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></svg>
      </a>
      <a href="https://x.com" target="_blank" rel="noopener" class="social-circle-btn" aria-label="X">
        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <a href="https://youtube.com" target="_blank" rel="noopener" class="social-circle-btn" aria-label="YouTube">
        <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      </a>
    </div>

    <div class="footer-legal-links">
      <a href="/gizlilik">Gizlilik</a>
      <span>·</span>
      <a href="/sartlar">Hizmet Şartları</a>
      <span>·</span>
      <a href="/guvenlik">Güvenlik</a>
      <span>·</span>
      <a href="/sss">SSS</a>
    </div>

    <div class="footer-copy">
      © 2026 Miruo Inc.
    </div>
  </div>
</footer>

<script src="site.js"></script>
<script>
  window.handleContactSubmit = function () {
    const btn = document.querySelector('.rave-form-btn');
    if (btn) {
      btn.innerText = 'Mesajınız Gönderildi ✓';
      btn.style.background = '#22C55E';
      btn.style.borderColor = '#22C55E';
      btn.style.color = '#FFFFFF';
    }
    if (window.showToast) {
      window.showToast('Mesajınız başarıyla iletildi! En kısa sürede dönüş yapacağız.');
    }
    setTimeout(() => {
      document.getElementById('contactForm').reset();
      if (btn) {
        btn.innerText = 'Mesajı gönder';
        btn.style.background = '';
        btn.style.borderColor = '';
        btn.style.color = '';
      }
    }, 3500);
  };
</script>
</body>
</html>
