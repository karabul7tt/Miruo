<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C26D97"/>
      <stop offset="100%" stop-color="#A64D79"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6A1E55"/>
      <stop offset="100%" stop-color="#3B1C32"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="#1A1A1D"/>
  <!-- Shadow half (Right) - faint trace in the dark -->
  <path d="M60 38 H76 L90 26 V68 Q90 96 60 96" fill="#3B1C32" fill-opacity="0.35" stroke="#6A1E55" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Light half (Left) - illuminated velvet rose -->
  <path d="M60 38 H44 L30 26 V68 Q30 96 60 96 Z" fill="url(#roseGrad)"/>
  <!-- Light side eye (black pupil with soft white glint) -->
  <circle cx="45" cy="62" r="10.5" fill="#1A1A1D"/>
  <circle cx="45" cy="62" r="4.2" fill="#FFFFFF" fill-opacity="0.9"/>
  <!-- Dark side eye (Watching in the shadows: Wine ring + glowing Rose pupil) -->
  <circle cx="75" cy="62" r="11.5" fill="#3B1C32" stroke="#6A1E55" stroke-width="1.5"/>
  <circle cx="75" cy="62" r="5.5" fill="#A64D79"/>
  <circle cx="76.5" cy="60.5" r="1.6" fill="#FFFFFF" fill-opacity="0.85"/>
  <!-- Beak -->
  <path d="M54 73 H60 V85 Z" fill="#A64D79"/>
  <path d="M60 73 H66 V85 Z" fill="#6A1E55"/>
</svg>