plugins {
    id 'com.android.application'
}

android {
    namespace 'com.miruo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.miruo.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                def storeFilePath = project.property('RELEASE_STORE_FILE')
                def sf = file(storeFilePath)
                if (!sf.exists()) {
                    sf = rootProject.file(storeFilePath)
                }
                if (sf.exists()) {
                    storeFile sf
                    storePassword project.findProperty('RELEASE_STORE_PASSWORD') ?: "miruopassword2026"
                    keyAlias project.findProperty('RELEASE_KEY_ALIAS') ?: "miruokey"
                    keyPassword project.findProperty('RELEASE_KEY_PASSWORD') ?: "miruopassword2026"
                }
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
